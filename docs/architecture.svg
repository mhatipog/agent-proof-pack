<title id="title">Agent Proof Pack — architecture</title><desc id="description">A software architecture diagram showing trusted operator-owned approval, untrusted AI agent, target database, and independent read-only witness. It distinguishes snapshot verification for SQLite and PostgreSQL from a transaction-bound guarded PostgreSQL sandbox, with redacted authenticated evidence.</desc>
