name: verification
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Public failure scenarios
        run: python -m agentproof suite
      - name: Incident-derived regression scenarios
        run: python -m agentproof suite --cases examples/incident_cases.json
      - name: Terraform safe synthetic plan is accepted
        run: python -m agentproof terraform --plan-json examples/terraform/safe-plan.json --policy examples/terraform/policy.json > /dev/null
      - name: Terraform destructive synthetic plan is rejected
        run: |
          if python -m agentproof terraform --plan-json examples/terraform/destructive-plan.json --policy examples/terraform/policy.json > /dev/null; then
            echo "Unexpected unsafe Terraform approval" >&2
            exit 1
          fi
