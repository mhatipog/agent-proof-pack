name: PostgreSQL effect witness (real database, read-only verifier)
on:
  pull_request:
    paths:
      - "agentproof/effect.py"
      - "agentproof/postgres_effect.py"
      - "agentproof/effect_cli.py"
      - "tests/integration_postgres.py"
      - ".github/workflows/postgres-effect.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "agentproof/effect.py"
      - "agentproof/postgres_effect.py"
      - "agentproof/effect_cli.py"
      - "tests/integration_postgres.py"
      - ".github/workflows/postgres-effect.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTPROOF_TEST_ADMIN_DSN: "postgresql://postgres:local-test-only@localhost:5432/postgres"
      AGENTPROOF_TEST_READER_DSN: "postgresql://witness_reader:local-reader-only@localhost:5432/postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL optional dependency
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Create SELECT-only observer role in isolated PostgreSQL
        shell: bash
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["AGENTPROOF_TEST_ADMIN_DSN"]) as conn:
              conn.execute("CREATE ROLE witness_reader LOGIN PASSWORD 'local-reader-only'")
              conn.execute("GRANT CONNECT ON DATABASE postgres TO witness_reader")
              conn.execute("GRANT USAGE ON SCHEMA public TO witness_reader")
          PY
      - name: Actual PostgreSQL negative and positive tests
        run: python -m unittest discover -s tests -p "integration_postgres.py" -v
      - name: SQLite parity and existing regressions
        run: python -m unittest discover -s tests -p "test_effect.py" -v
