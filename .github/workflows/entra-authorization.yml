name: Entra identity-bound authorization
on:
  push:
    paths:
      - 'agentproof/entra.py'
      - 'agentproof/entra_guard.py'
      - 'tests/test_entra_authorization.py'
      - 'pyproject.toml'
      - '.github/workflows/entra-authorization.yml'
  pull_request:
    paths:
      - 'agentproof/entra.py'
      - 'agentproof/entra_guard.py'
      - 'tests/test_entra_authorization.py'
      - 'pyproject.toml'
      - '.github/workflows/entra-authorization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-claims:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install guarded optional dependencies
        run: python -m pip install -e '.[entra]'
      - name: Enforce token signature and fail-closed authorization cases
        run: python -m unittest tests/test_entra_authorization.py -v
      - name: Existing PostgreSQL client contract unit regression
        run: python -m unittest tests/test_generic_cli.py -v
