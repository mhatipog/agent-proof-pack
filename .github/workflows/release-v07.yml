name: Publish verified v0.7 GitHub release
on:
  workflow_run:
    workflows:
      - "Documented incident class on upstream Chinook PostgreSQL"
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm exact approved main SHA, full test suite and wheel version
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')"
          test "$head" = "$SOURCE_SHA"
          python -m unittest discover -s tests -v
          python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              assert tomllib.load(f)["project"]["version"] == "0.7.0"
          PY
          python -m pip install --disable-pip-version-check build
          python -m build --wheel
          python -m pip install --no-deps dist/*.whl
          agent-guarded --help >/dev/null
          agent-effect demo --mode correct >/dev/null
          if agent-effect demo --mode collateral >/dev/null; then
            echo "unapproved collateral write incorrectly verified" >&2
            exit 1
          fi
      - name: Publish release once without rewriting existing tags
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.7.0 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'v0.7.0 exists; will not overwrite or move tag'
            exit 0
          fi
          gh release create v0.7.0 \
            --repo "$GH_REPO" --target "$TARGET_SHA" \
            --title "v0.7.0 — PostgreSQL gate hardening and agent tool" \
            --notes-file docs/RELEASE_V07.md dist/*.whl
